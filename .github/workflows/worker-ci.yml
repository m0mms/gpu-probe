name: Worker source checks
on:
  pull_request:
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 ci/check_context.py
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          buildkitd-flags: --oci-worker-gc
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./image
          file: ./image/Dockerfile
          call: check
          push: false
