name: One CPU-only qualification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gpu-probe-cpu-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'm0mms/gpu-probe' && github.sha == vars.CPU_QUALIFICATION_SHA && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cpu-qualification
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      REVIEWED_SHA: ${{ vars.CPU_QUALIFICATION_SHA }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline local gates
        run: python3 -B -m unittest discover -v
      - name: Exact source and capacity admission
        run: python3 -B campaign.py preflight
      - name: Fetch hash-locked public inputs
        run: timeout --signal=TERM --kill-after=2s 300s python3 -B fetch.py
      - name: Load only hash-verified local base images
        run: timeout --signal=TERM --kill-after=2s 360s python3 -B base_images.py
      - name: One worker then one controller qualification
        run: python3 -B campaign.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-qualification-${{ github.run_id }}
          path: cpu-qualification/evidence/*.json
          if-no-files-found: warn
          retention-days: 14
