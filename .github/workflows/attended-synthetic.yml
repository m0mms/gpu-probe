name: One CPU-only artifact build
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gpu-probe-cpu-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'm0mms/gpu-probe' && github.sha == vars.CPU_QUALIFICATION_SHA && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cpu-qualification
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      REVIEWED_SHA: ${{ vars.CPU_QUALIFICATION_SHA }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline local gates
        timeout-minutes: 1
        run: python3 -B -m unittest discover -v
      - name: Exact source and capacity admission
        run: timeout --signal=TERM --kill-after=2s 15s python3 -B campaign.py preflight
      - name: Fetch hash-locked public inputs
        run: timeout --signal=TERM --kill-after=2s 120s python3 -B fetch.py
      - name: Load only hash-verified local base images
        run: timeout --signal=TERM --kill-after=2s 120s python3 -B base_images.py
      - name: One worker then one controller qualification
        run: timeout --signal=TERM --kill-after=30s 600s python3 -B campaign.py
      - name: Retain candidate artifacts
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-candidate-artifacts-${{ github.run_id }}
          path: cpu-qualification/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded evidence
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-qualification-${{ github.run_id }}
          path: cpu-qualification/evidence/*.json
          if-no-files-found: warn
          retention-days: 14
