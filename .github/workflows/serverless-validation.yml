name: Serverless local-image validation without publication
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed exact source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gpu-probe-serverless-validation
  cancel-in-progress: false
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    if: github.repository == 'm0mms/gpu-probe' && github.sha == vars.SERVERLESS_VALIDATION_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serverless
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source and capacity admission
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REVIEWED_SHA: ${{ vars.SERVERLESS_VALIDATION_SHA }}
        run: python3 ci/preflight.py
      - name: Local gates
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          python3 image/check_context.py
      - id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker-container
          buildkitd-flags: --oci-worker-gc
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000
      - name: Verify builder limits
        env:
          BUILDER_NODES: ${{ steps.builder.outputs.nodes }}
        run: python3 ci/builder.py
      - id: build
        name: Build only; no registry publication
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./serverless/image
          file: ./serverless/image/Dockerfile.candidate
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Installed SDK and CPU-only compiler controls
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: python3 ci/runtime_check.py
      - id: scanner
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
          cache: 'false'
      - name: OS and Python vulnerability coverage
        if: always() && steps.build.outcome == 'success' && steps.scanner.outcome == 'success'
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: python3 ci/security_scan.py
      - name: Preserve local validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: serverless-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: serverless/evidence/*.json
          if-no-files-found: warn
          retention-days: 14
