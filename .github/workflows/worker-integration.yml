name: Worker Linux integration without publishing
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed integration commit
        required: true
        type: string
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
permissions:
  contents: read
concurrency:
  group: gpu-probe-linux-integration
  cancel-in-progress: false
jobs:
  integration:
    if: github.repository == 'm0mms/gpu-probe' && github.ref == 'refs/heads/main' && github.sha == vars.GPU_PROBE_INTEGRATION_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EVIDENCE_DIR: integration-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source and capacity admission
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 ci/preflight.py
      - name: Unit controls including file/output limits
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Start finite disk observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          nohup python3 ci/integration_resources.py monitor > "$RUNNER_TEMP/resource-sampler.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 20); do
            if test -f "$EVIDENCE_DIR/resources.json"; then break; fi
            sleep 0.2
          done
          python3 ci/integration_resources.py check
      - id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          buildkitd-flags: --oci-worker-gc
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000
      - name: Observe effective builder limits
        env:
          BUILDER_NODES: ${{ steps.builder.outputs.nodes }}
        run: python3 ci/integration_binding.py builder
      - id: build
        name: Build locally without publication or attestations
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
      - run: python3 ci/integration_resources.py check
      - id: local
        name: Bind loaded image ID
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: python3 ci/integration_binding.py image
      - name: Complete synthetic worker suite
        env:
          QUALIFY_IMAGE: ${{ steps.local.outputs.image }}
          QUALIFICATION_MODE: local-build
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          EVIDENCE_DIR="$EVIDENCE_DIR/suite" python3 ci/qualify.py
      - name: Verify actual Docker-save client limit
        env:
          QUALIFY_IMAGE: ${{ steps.local.outputs.image }}
        run: python3 ci/save_limit_control.py
      - name: Forced failure cleanup control
        env:
          QUALIFY_IMAGE: ${{ steps.local.outputs.image }}
          QUALIFICATION_MODE: local-build
          QUALIFICATION_FORCE_FAILURE: '1'
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          python3 ci/failure_control.py
      - name: Stop finite observation and check final resource evidence
        if: always()
        run: python3 ci/integration_resources.py stop
      - id: evidence
        name: Validate aggregate retained evidence
        if: always()
        run: python3 ci/integration_evidence.py
      - name: Preserve JSON integration evidence only
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-evidence/**/*.json
          if-no-files-found: error
          retention-days: 30
